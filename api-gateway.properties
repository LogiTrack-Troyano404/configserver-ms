# Puerto y registro en Eureka
server.port=8066
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8065/eureka/

# Configuración de Actuator para métricas y rutas
management.endpoints.web.exposure.include=*
management.info.env.enabled=true
management.endpoint.gateway.enabled=true

# Habilitar enrutamiento dinámico basado en los nombres de Eureka
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lowerCaseServiceId=true

# --- RUTAS DINÁMICAS DE LOGITRACK ---

# 0. Security Service - Login directo
spring.cloud.gateway.routes[0].id=security-auth
spring.cloud.gateway.routes[0].uri=lb://SECURITY-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# 1. Ruta para Security Service (/api/v1/auth/** hacia /auth/**)
spring.cloud.gateway.routes[1].id=security-service
spring.cloud.gateway.routes[1].uri=lb://SECURITY-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/auth/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/api/v1/auth/(?<segment>.*), /auth/${segment}

# 2. Ruta para Shipment Service - Envíos (/api/v1/envios/**)
spring.cloud.gateway.routes[2].id=shipment-service-envios
spring.cloud.gateway.routes[2].uri=lb://SHIPMENT-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/envios/**

# 3. Ruta para Shipment Service - Clientes (/api/v1/clientes/**)
spring.cloud.gateway.routes[3].id=shipment-service-clientes
spring.cloud.gateway.routes[3].uri=lb://SHIPMENT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/clientes/**

# 4. Ruta para Courier Service - Repartidores (/api/v1/repartidores/**)
spring.cloud.gateway.routes[4].id=courier-service
spring.cloud.gateway.routes[4].uri=lb://COURIER-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/repartidores/**

# --- CONFIGURACI�N CORS GLOBAL ---

spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposed-headers=Authorization
